plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.17'
}

version='1.0.0'

group='dev.wigo'

base { archivesName='wigo-forge-26.1.1' }

java { toolchain.languageVersion=JavaLanguageVersion.of(25) }

minecraft {
    runs {
        configureEach {
            systemProperty 'eventbus.api.strictRuntimeChecks','true'
            args '--mixin.config=wigo.mixins.json','--mixin.config=wigo.client.mixins.json','--mixin.config=wigo.forge.mixins.json'
            mods {
                wigo {
                    source sourceSets.main
                }

            }
        }
        register('client') {
            workingDir=layout.buildDirectory.dir('run/client')

        }
        register('server') { workingDir=layout.buildDirectory.dir('run/server'); args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.1.1-63.0.2')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8';options.release=21 }

configurations.matching { it.name in ['compileClasspath','runtimeClasspath']||it.name.endsWith('CompileClasspath')||it.name.endsWith('RuntimeClasspath') }.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,25)
}

jar {
    preserveFileTimestamps=false
    reproducibleFileOrder=true
    manifest { attributes 'MixinConfigs':'wigo.mixins.json,wigo.client.mixins.json,wigo.forge.mixins.json' }
}

apply from: '../../gradle/release.gradle'
