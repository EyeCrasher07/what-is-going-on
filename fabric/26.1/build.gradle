plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }

version='1.0.0'

group='dev.wigo'

base { archivesName='wigo-fabric-26.1' }

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:26.1'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
}

java { toolchain.languageVersion=JavaLanguageVersion.of(25) }

tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }

jar { preserveFileTimestamps=false;reproducibleFileOrder=true }

loom.runs {
    client { runDir 'run/client' }
    server { runDir 'run/server'; programArg 'nogui' }
}

tasks.register('verifyProtocol', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.wigo.protocol.MirrorStateTest'
}
// The protocol suite has its own executable assertion harness.
tasks.named('test') { enabled = false }
check.dependsOn verifyProtocol

apply from: '../../gradle/release.gradle'
