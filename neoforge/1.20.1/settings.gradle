pluginManagement {
    resolutionStrategy { eachPlugin { if(requested.id.id.startsWith("net.neoforged.moddev"))useModule("net.neoforged:moddev-gradle:"+requested.version) } }
    repositories {
        maven { url='https://maven.neoforged.net/releases' }
        maven { url='https://maven.minecraftforge.net' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name='wigo-neoforge-1.20.1'
