plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = '1.0.2'

group = 'dev.wigo'

base { archivesName = 'wigo-neoforge-1.20.5' }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

minecraft.accessTransformers.file(file('src/main/resources/META-INF/accesstransformer.cfg'))

runs {
    configureEach {
        workingDirectory layout.buildDirectory.dir('run').map { it.dir(name) }
        modSources { add('wigo',sourceSets.main) }
    }
    client {

    }
    server { argument '--nogui' }
}

repositories { mavenCentral() }

jarJar.enable()

tasks.named('jar') { archiveClassifier='slim' }

tasks.named('jarJar') { archiveClassifier='' }

dependencies {
    implementation 'net.neoforged:neoforge:20.5.21-beta'
    implementation(jarJar('io.github.llamalad7:mixinextras-neoforge:0.5.4')) { jarJar.ranged(it,'[0.5.4,0.6)') }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar { preserveFileTimestamps = false; reproducibleFileOrder = true }

apply from: '../../gradle/release.gradle'
