plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'

group = 'dev.wigo'

base { archivesName = 'wigo-neoforge-26.1.1' }

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

neoForge {
    version = '26.1.1.15-beta'

    mods { wigo { sourceSet(sourceSets.main) } }
    runs {
        client {
            client(); gameDirectory = project.file('build/run/client')

        }
        server { server(); gameDirectory = project.file('build/run/server'); programArgument '--nogui' }
    }
}

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar { preserveFileTimestamps = false; reproducibleFileOrder = true }

apply from: '../../gradle/release.gradle'
