plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.2'

group = 'dev.wigo'

base { archivesName = 'wigo-neoforge-1.21.4' }

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

neoForge {
    version = '21.4.158'
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    mods { wigo { sourceSet(sourceSets.main) } }
    runs {
        client {
            client(); gameDirectory = project.file('build/run/client')

        }
        server { server(); gameDirectory = project.file('build/run/server'); programArgument '--nogui' }
    }
}

repositories { mavenCentral() }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar { preserveFileTimestamps = false; reproducibleFileOrder = true }

apply from: '../../gradle/release.gradle'
